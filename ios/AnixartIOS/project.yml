name: AnixartIOS
options:
  bundleIdPrefix: com.anixartios
  deploymentTarget:
    iOS: "17.0"
targets:
  AnixartIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/AnixartIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.anixartios.app
        PRODUCT_NAME: AnixartIOS
        MARKETING_VERSION: "10.5.0"
        CURRENT_PROJECT_VERSION: "26101718"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Anixart
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Anixart
        UIBackgroundModes:
          - audio
        CFBundleURLTypes:
          - CFBundleURLName: com.anixartios.app.deeplink
            CFBundleURLSchemes:
              - anixart
              - vk54701760
              - yxa980f00536554180b4826f7daa76f060
        LSApplicationQueriesSchemes:
          - tg
          - vk
          - yandexauth
