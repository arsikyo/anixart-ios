name: Build AnixartIOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/AnixartIOS/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/AnixartIOS
        run: xcodegen generate

      - name: Build unsigned iOS app
        working-directory: ios/AnixartIOS
        run: |
          xcodebuild \
            -project AnixartIOS.xcodeproj \
            -scheme AnixartIOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package unsigned IPA
        working-directory: ios/AnixartIOS
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AnixartIOS.app Payload/
          zip -r -y AnixartIOS-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnixartIOS-unsigned-ipa
          path: ios/AnixartIOS/AnixartIOS-unsigned.ipa
